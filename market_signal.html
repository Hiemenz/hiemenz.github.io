<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c11; --surf:#12151d; --surf2:#1a1e29; --line:#232838;
  --text:#e6eaf4; --dim:#7a86a3; --faint:#4c5670;
  --accent:#f7931a;
  --hot:#ef5f5f; --warm:#f0a830; --cool:#6f7d99; --good:#3ecf8e;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
body.re{--bg:#0d0f0c;--surf:#161a15;--surf2:#1e2319;--line:#282f24;
  --text:#e8ece2;--dim:#78876f;--faint:#4d5a46;--accent:#c9a24f}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;
  line-height:1.55;transition:background .25s}

.tabs{display:flex;height:52px;background:#06080c;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;align-items:stretch}
body.re .tabs{background:#080a07}
.tab{display:flex;align-items:center;gap:8px;padding:0 22px;border:0;background:none;
  cursor:pointer;font-family:var(--body);font-size:12px;font-weight:600;color:var(--faint);
  letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid transparent;
  transition:color .2s,border-color .2s}
.tab:hover{color:var(--dim)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.stamp{margin-left:auto;display:flex;align-items:center;padding:0 18px;font-family:var(--mono);
  font-size:11px;color:var(--faint)}

.page{max-width:1280px;margin:0 auto;padding:28px 24px 56px}
[hidden]{display:none!important}

.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);display:flex;align-items:center;gap:10px;margin:0 0 12px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}

/* --- cycle verdict --- */
.verdict{background:var(--surf);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:30px}
.verdict-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
.verdict-main{padding:26px 28px;border-right:1px solid var(--line)}
.regime{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);padding:5px 10px;border-radius:5px}
.phase{font-family:var(--disp);font-size:clamp(30px,4.6vw,46px);font-weight:700;
  letter-spacing:-.02em;line-height:1.05;margin:16px 0 8px;text-wrap:balance}
.phase-blurb{font-size:14px;color:var(--dim);max-width:46ch}
.evidence{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.eq{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--surf2);
  border:1px solid var(--line);padding:4px 9px;border-radius:5px;white-space:nowrap}

.verdict-side{padding:26px 28px;display:flex;flex-direction:column;gap:20px}
.side-h{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:10px}
.conf{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.conf b{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1}
.conf span{font-size:11px;color:var(--dim)}
.pdist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:104px 1fr 38px;align-items:center;gap:10px}
.pname{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptrack{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;background:var(--accent);opacity:.55}
.prow:first-child .pfill{opacity:1}
.ppct{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums}
.bias{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--surf2)}
.bias i{display:block;height:100%}
.bias-key{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
.bk{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.bk i{width:7px;height:7px;border-radius:2px}
.basis{font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px}
.basis b{color:var(--dim);font-family:var(--mono);font-weight:600}

/* --- watch list --- */
.watch{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;
  margin-bottom:30px}
.w{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--cool);
  border-radius:9px;padding:15px 16px;display:flex;flex-direction:column;gap:7px}
.w[data-state="triggered"]{border-left-color:var(--hot)}
.w[data-state="armed"]{border-left-color:var(--warm)}
.w[data-state="clear"]{border-left-color:var(--good)}
.w-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.w-name{font-size:13px;font-weight:600;color:var(--text)}
.w-state{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap;
  background:color-mix(in srgb,var(--cool) 18%,transparent);color:var(--cool)}
.w[data-state="triggered"] .w-state{background:color-mix(in srgb,var(--hot) 18%,transparent);color:var(--hot)}
.w[data-state="armed"] .w-state{background:color-mix(in srgb,var(--warm) 18%,transparent);color:var(--warm)}
.w[data-state="clear"] .w-state{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.w-val{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums}
.w-detail{font-size:12px;color:var(--dim);line-height:1.5}
.w-freq{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:auto;padding-top:4px}

/* --- tables --- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  margin-bottom:22px}
.card-h{padding:13px 17px;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.card-h em{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.sym{font-family:var(--mono);font-size:12px;font-weight:700}
.sub{font-size:11px;color:var(--faint)}
.num{font-family:var(--mono);font-size:12px}
.up{color:var(--good)}.dn{color:var(--hot)}.nt{color:var(--faint)}
.freqbar{display:inline-block;height:4px;border-radius:2px;background:var(--accent);
  vertical-align:middle;margin-right:6px}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;
  background:var(--surf2);color:var(--dim);margin:0 5px 5px 0}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;
  color:var(--faint);line-height:1.7}
.foot code{font-family:var(--mono);color:var(--dim)}
@media (max-width:880px){
  .verdict-top{grid-template-columns:1fr}
  .verdict-main{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);

const money = (n, d = 0) => n == null ? '--'
  : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const price = n => n == null ? '--'
  : n >= 1000 ? money(n) : n >= 1 ? '$' + n.toFixed(2)
  : n >= 0.01 ? '$' + n.toFixed(4) : '$' + n.toFixed(8);
const signed = n => n == null ? '--' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const cls = n => n == null ? 'nt' : n > 0 ? 'up' : n < 0 ? 'dn' : 'nt';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

const BIAS_COLOR = {bullish: 'var(--good)', bearish: 'var(--hot)',
                    neutral: 'var(--cool)', uncertain: 'var(--warm)', mixed: 'var(--warm)'};

function verdictHTML(c, videos) {
  const top = c.primary;
  if (!top) return '';
  const bias = (c.bias || []).map(b =>
    `<i style="width:${b.share}%;background:${BIAS_COLOR[b.name] || 'var(--cool)'}"></i>`).join('');
  const key = (c.bias || []).map(b =>
    `<span class="bk"><i style="background:${BIAS_COLOR[b.name] || 'var(--cool)'}"></i>${esc(b.name)} ${b.share}%</span>`).join('');
  return `
  <section class="verdict">
    <div class="verdict-top">
      <div class="verdict-main">
        <span class="regime">${esc(c.regime_label)}</span>
        <h1 class="phase">${esc(top.label)}</h1>
        <p class="phase-blurb">${esc(top.blurb)}</p>
        <div class="evidence">${(c.evidence || []).map(e => `<span class="eq">${esc(e)}</span>`).join('')}</div>
      </div>
      <div class="verdict-side">
        <div>
          <div class="side-h">Read consistency</div>
          <div class="conf"><b>${c.confidence}%</b><span>of comparable videos called it ${esc(top.label.toLowerCase())}</span></div>
          <div class="pdist">${(c.phases || []).map(p => `
            <div class="prow">
              <span class="pname" title="${esc(p.label)}">${esc(p.label)}</span>
              <span class="ptrack"><span class="pfill" style="width:${p.share}%"></span></span>
              <span class="ppct">${p.share}%</span>
            </div>`).join('')}</div>
        </div>
        <div>
          <div class="side-h">Stance in these conditions</div>
          <div class="bias">${bias}</div>
          <div class="bias-key">${key}</div>
        </div>
        <p class="basis">Based on <b>${c.sample_size}</b> of ${videos} analysed videos published while
        ${esc(c.regime_blurb || 'conditions matched')}.</p>
      </div>
    </div>
  </section>`;
}

function watchHTML(items) {
  return `<div class="eyebrow">What to watch</div>
  <div class="watch">${items.map(w => `
    <article class="w" data-state="${esc(w.state)}">
      <div class="w-top">
        <span class="w-name">${esc(w.name)}</span>
        <span class="w-state">${esc(w.state)}</span>
      </div>
      <div class="w-val">${esc(w.current)}</div>
      <p class="w-detail">${esc(w.detail)}</p>
      ${w.weight ? `<div class="w-freq">cited in ${w.weight} videos</div>` : ''}
    </article>`).join('')}</div>`;
}

function coinsHTML(coins, total) {
  if (!coins.length) return '';
  const max = Math.max(...coins.map(c => c.videos), 1);
  return `<div class="card">
    <div class="card-h">Coverage by coin <em>share of ${total} videos mentioning each</em></div>
    <div class="scroll"><table>
      <thead><tr><th>Coin</th><th class="r">Price</th><th class="r">24h</th>
        <th class="r">Market cap</th><th class="r">Mentioned in</th></tr></thead>
      <tbody>${coins.map(c => `<tr>
        <td><div class="sym">${esc(c.sym)}</div><div class="sub">${esc(c.name)}</div></td>
        <td class="r num">${price(c.price)}</td>
        <td class="r num ${cls(c.c24)}">${signed(c.c24)}</td>
        <td class="r num">${c.mc >= 1 ? c.mc.toFixed(1) + 'B' : '--'}</td>
        <td class="r"><span class="freqbar" style="width:${Math.max(3, c.videos / max * 54)}px;
          opacity:${c.videos ? .85 : .15}"></span><span class="sub">${c.videos
          ? c.videos + ' (' + c.vpct + '%)' : 'not covered'}</span></td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
}

function hoodsHTML(hoods) {
  if (!hoods.length) return '';
  return `<div class="card">
    <div class="card-h">Neighbourhoods <em>fastest to slowest by days on market</em></div>
    <div class="scroll"><table>
      <thead><tr><th>Area</th><th class="r">Days on market</th><th class="r">Active</th>
        <th class="r">Active YoY</th><th class="r">Home value</th><th class="r">YoY</th></tr></thead>
      <tbody>${hoods.map(h => `<tr>
        <td><div class="sym">${esc(h.name)}</div><div class="sub">${esc(h.zip)}</div></td>
        <td class="r num">${h.dom != null ? h.dom.toFixed(0) + 'd' : '--'}</td>
        <td class="r num">${h.active != null ? h.active.toLocaleString('en-US') : '--'}</td>
        <td class="r num ${cls(h.active_yoy)}">${signed(h.active_yoy)}</td>
        <td class="r num">${h.zhvi != null ? money(Math.round(h.zhvi / 1000)) + 'K' : '--'}</td>
        <td class="r num ${cls(h.yoy)}">${signed(h.yoy)}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
}

function themesHTML(c) {
  if (!c.themes || !c.themes.length) return '';
  return `<div class="card">
    <div class="card-h">Language of this regime <em>recurring phrasing in comparable videos</em></div>
    <div style="padding:15px 17px">${c.themes.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
  </div>`;
}

function render(tab) {
  const d = D[tab];
  const videos = tab === 'crypto' ? D.totals.crypto_videos : D.totals.re_videos;
  document.body.classList.toggle('re', tab === 're');
  document.getElementById('root').innerHTML = `<div class="page">
    ${verdictHTML(d.cycle, videos)}
    ${watchHTML(d.watch)}
    ${tab === 'crypto' ? coinsHTML(d.coins, videos) : hoodsHTML(d.hoods)}
    ${themesHTML(d.cycle)}
    <p class="foot">
      Cycle position is inferred by matching today's market conditions to the regime in force when each
      of these videos was published, then reading back the phase the creator called at the time.
      Market data refreshes daily; the video analysis is a fixed corpus of
      ${D.totals.crypto_videos + D.totals.re_videos} videos and is not re-parsed.<br>
      Generated <code>${esc(D.generated_at.slice(0, 16).replace('T', ' '))} UTC</code> ·
      profile built <code>${esc((D.profile_built_at || '').slice(0, 10))}</code>
    </p>
  </div>`;
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b =>
      b.setAttribute('aria-selected', String(b === btn)));
    render(btn.dataset.tab);
  });
});
render('crypto');
</script>
